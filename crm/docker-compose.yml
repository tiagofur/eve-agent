services:
  postgres:
    image: postgres:17
    container_name: creapolis-crm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: creapolis
      POSTGRES_PASSWORD: creapolis
      POSTGRES_DB: creapolis
    ports:
      # 5433 on the host so it never collides with a Postgres installed via Homebrew.
      - "5433:5432"
    volumes:
      - creapolis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creapolis -d creapolis"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  creapolis_pgdata:
